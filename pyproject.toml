[project]
name = "portfolio-research-engine"
version = "0.1.0"
description = "Local, read-only portfolio research decision support"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "cvxpy>=1.6,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "PyPortfolioOpt>=1.5.6,<2"]
broker = ["webull-openapi-python-sdk"]
[project.scripts]
portfolio-engine = "portfolio_engine.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_engine"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[dependency-groups]
dev = ["pytest>=8,<10", "PyPortfolioOpt>=1.5.6,<2"]
